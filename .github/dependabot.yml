# Dependabot сам открывает PR, когда устаревают версии GitHub Actions или NuGet-пакетов
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
