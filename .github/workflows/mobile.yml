name: Build mobile apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install Android workload
        shell: powershell
        run: dotnet workload install maui-android

      - name: Verify repository structure
        shell: powershell
        run: node .\tests\static-verify.mjs

      # Докачивает недостающие компоненты Android SDK (платформа, build-tools) под .NET 10
      - name: Install Android SDK components
        shell: powershell
        run: >-
          dotnet build .\src\MorseTrainer.Mobile\MorseTrainer.Mobile.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:MobileTargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # MobileTargetFrameworks сужает сборку до Android, чтобы Windows-раннер не пытался собирать iOS
      - name: Build Android APK
        shell: powershell
        run: |
          # Подпись: постоянный ключ из секретов репозитория; без секретов — временный debug-ключ
          $signArgs = @()
          if ($env:ANDROID_KEYSTORE_BASE64) {
            $ks = Join-Path $env:RUNNER_TEMP "morsetrainer.jks"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $signArgs = @(
              "-p:AndroidKeyStore=true",
              "-p:AndroidSigningKeyStore=$ks",
              "-p:AndroidSigningKeyAlias=morsetrainer",
              "-p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD",
              "-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD")
            Write-Host "Signing: release keystore from secrets"
          } else {
            Write-Host "Signing: debug keystore (secrets are not set)"
          }
          dotnet publish .\src\MorseTrainer.Mobile\MorseTrainer.Mobile.csproj `
            -f net10.0-android `
            -c Release `
            -p:MobileTargetFrameworks=net10.0-android `
            -p:AndroidPackageFormats=apk `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME" `
            -p:JavaSdkDirectory="$env:JAVA_HOME" `
            @signArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Android APK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\mobile-artifacts\android -Force | Out-Null
          Get-ChildItem .\src\MorseTrainer.Mobile\bin\Release\net10.0-android -Recurse -Filter *.apk |
            Copy-Item -Destination .\mobile-artifacts\android

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: MorseTrainer-Android
          path: mobile-artifacts/android/*.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      # Симуляторная сборка на ARM64-раннере, подпись не нужна: CodesignKey пустой
      - name: Build iPhone simulator app
        run: >-
          dotnet build ./src/MorseTrainer.Mobile/MorseTrainer.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:MobileTargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:CodesignKey=""

  ios-device:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      # Сборка под настоящий iPhone (ios-arm64) без подписи Apple: подписать можно на своём
      # компьютере обычным Apple ID через Sideloadly/AltStore (см. MOBILE.md)
      - name: Build unsigned iPhone app
        run: >-
          dotnet build ./src/MorseTrainer.Mobile/MorseTrainer.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:MobileTargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:CodesignKey=""

      - name: Package unsigned IPA
        run: |
          set -e
          app=$(find ./src/MorseTrainer.Mobile/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "Не найдено .app после сборки"; exit 1; }
          rm -rf ./dist/ipa && mkdir -p ./dist/ipa/Payload
          cp -R "$app" ./dist/ipa/Payload/
          (cd ./dist/ipa && zip -qr ../MorseTrainer-iOS-unsigned.ipa Payload)
          ls -la ./dist/MorseTrainer-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: MorseTrainer-iOS-unsigned
          path: dist/MorseTrainer-iOS-unsigned.ipa
          if-no-files-found: error
