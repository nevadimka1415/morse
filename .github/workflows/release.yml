name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Verify repository structure
        shell: powershell
        run: node .\tests\static-verify.mjs

      - name: Test and build
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\build.ps1 -Version $version

      # Описание релиза = раздел CHANGELOG.md для этой версии; если раздела нет — заметки из коммитов
      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content .\CHANGELOG.md -Encoding UTF8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ("^## " + [regex]::Escape($version) + "\s*$")) { $start = $i + 1; break } }
          $notesArgs = @("--generate-notes")
          if ($start -ge 0) {
            $body = @()
            for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { break }; $body += $lines[$i] }
            $notes = ($body -join "`n").Trim()
            if ($notes) {
              [IO.File]::WriteAllText("dist\release-notes.md", $notes + "`n", (New-Object System.Text.UTF8Encoding $false))
              $notesArgs = @("--notes-file", "dist/release-notes.md")
              Write-Host "Release notes: CHANGELOG section $version"
            }
          }
          if ($notesArgs[0] -eq "--generate-notes") { Write-Host "Release notes: generated from commits (no CHANGELOG section $version)" }
          gh release create "${{ github.ref_name }}" `
            "dist/MorseTrainer-Windows-x64.zip" `
            "dist/MorseTrainer-Setup-x64.exe" `
            --title "Morse Trainer ${{ github.ref_name }}" `
            @notesArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Android APK собирается отдельно и докладывается в уже созданный релиз:
  # так его можно скачать с телефона прямо со страницы Releases
  android:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install Android workload
        shell: powershell
        run: dotnet workload install maui-android

      - name: Install Android SDK components
        shell: powershell
        run: >-
          dotnet build .\src\MorseTrainer.Mobile\MorseTrainer.Mobile.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:MobileTargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # Версия берётся из тега: v2.2.1 -> 2.2.1, а versionCode = 2*10000 + 2*100 + 1 = 20201,
      # чтобы каждый следующий релиз Android считал обновлением
      - name: Build Android APK
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $m = [regex]::Match($version, '^(\d+)\.(\d+)\.(\d+)')
          $code = [int]$m.Groups[1].Value * 10000 + [int]$m.Groups[2].Value * 100 + [int]$m.Groups[3].Value
          # Подпись: постоянный ключ из секретов репозитория; без секретов — временный debug-ключ
          $signArgs = @()
          if ($env:ANDROID_KEYSTORE_BASE64) {
            $ks = Join-Path $env:RUNNER_TEMP "morsetrainer.jks"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $signArgs = @(
              "-p:AndroidKeyStore=true",
              "-p:AndroidSigningKeyStore=$ks",
              "-p:AndroidSigningKeyAlias=morsetrainer",
              "-p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD",
              "-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD")
            Write-Host "Signing: release keystore from secrets"
          } else {
            Write-Host "Signing: debug keystore (secrets are not set)"
          }
          dotnet publish .\src\MorseTrainer.Mobile\MorseTrainer.Mobile.csproj `
            -f net10.0-android `
            -c Release `
            -p:MobileTargetFrameworks=net10.0-android `
            -p:AndroidPackageFormats=apk `
            -p:ApplicationDisplayVersion=$version `
            -p:ApplicationVersion=$code `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME" `
            -p:JavaSdkDirectory="$env:JAVA_HOME" `
            @signArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          $apk = Get-ChildItem .\src\MorseTrainer.Mobile\bin\Release\net10.0-android -Recurse -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem .\src\MorseTrainer.Mobile\bin\Release\net10.0-android -Recurse -Filter *.apk | Select-Object -First 1 }
          if (-not $apk) { throw "APK not found" }
          Copy-Item $apk.FullName .\dist\MorseTrainer-Android.apk
          Get-Item .\dist\MorseTrainer-Android.apk | Format-List Name, Length

      - name: Attach APK to GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "dist/MorseTrainer-Android.apk" --clobber

  # Неподписанный IPA для установки на iPhone через Sideloadly/AltStore
  ios:
    needs: release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      # Сборка под настоящий iPhone (ios-arm64) без подписи Apple: подписать можно на своём
      # компьютере обычным Apple ID через Sideloadly/AltStore (см. MOBILE.md)
      - name: Build unsigned iPhone app
        run: >-
          dotnet build ./src/MorseTrainer.Mobile/MorseTrainer.Mobile.csproj
          -f net10.0-ios
          -c Release
          -p:MobileTargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:CodesignKey=""

      - name: Package unsigned IPA
        run: |
          set -e
          app=$(find ./src/MorseTrainer.Mobile/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "Не найдено .app после сборки"; exit 1; }
          rm -rf ./dist/ipa && mkdir -p ./dist/ipa/Payload
          cp -R "$app" ./dist/ipa/Payload/
          (cd ./dist/ipa && zip -qr ../MorseTrainer-iOS-unsigned.ipa Payload)
          ls -la ./dist/MorseTrainer-iOS-unsigned.ipa

      - name: Attach IPA to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "dist/MorseTrainer-iOS-unsigned.ipa" --clobber
